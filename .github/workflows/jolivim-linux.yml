# Build the JoliVIM packages for Linux with packaging/build.sh.
#
# A package only works on the distribution version it was built on, so there is
# one for each version.  They are uploaded as workflow artifacts and, for a tag,
# attached to the GitHub release.  The snap is not published to the Snap Store.
name: JoliVIM Linux packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build
        type: choice
        options: [all, ubuntu-24.04, ubuntu-26.04, fedora-44, fedora-45, el10, slackware-current, snap]
        default: all
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: jolivim-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # The matrix is not known in a job condition: skip the steps instead.
    env:
      SKIP: ${{ inputs.package && inputs.package != 'all' && inputs.package != matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-24.04, kind: deb, image: 'ubuntu:24.04' }
          - { name: ubuntu-26.04, kind: deb, image: 'ubuntu:26.04' }
          - { name: fedora-44, kind: rpm, image: 'fedora:44' }
          - { name: fedora-45, kind: rpm, image: 'fedora:45' }
          # Also for RHEL 10, Oracle Linux 10 and Rocky Linux 10.
          - { name: el10, kind: rpm, image: 'almalinux:10' }
          # A third-party image: fixed to what was checked.  Update the digest
          # to follow Slackware -current.
          - name: slackware-current
            kind: txz
            image: 'aclemons/slackware:current-full@sha256:162d4e25a6f61876b5c9e9ad72e1e2f0d9d4b16dfe031e6f95c4127b893d3972'
          # Built from packaging/snap/Dockerfile.
          - { name: snap, kind: snap, image: '' }

    steps:
      - name: Checkout
        if: env.SKIP != 'true'
        uses: actions/checkout@v7

      # The full Slackware image takes about 37 Gbyte, more than is free on the
      # runner.
      - name: Free disk space
        if: env.SKIP != 'true' && matrix.kind == 'txz'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /usr/lib/jvm \
              /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache
          docker image prune -af
          df -h /

      - name: Build the package
        if: env.SKIP != 'true'
        run: packaging/build.sh ${{ matrix.kind }} '${{ matrix.image }}'

      - name: Upload the package
        if: env.SKIP != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jolivim-${{ matrix.name }}
          path: packaging/out/*.${{ matrix.kind }}
          if-no-files-found: error

  # Separate from the builds, so that the images have no write access.
  release:
    name: Attach to the release
    # Attach what was built, even if one package failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes \
              --notes "Windows: install JoliVIM from the [Microsoft Store](https://apps.microsoft.com/detail/9n2288l1n1fj)."
          gh release upload "$TAG" packages/* --clobber
